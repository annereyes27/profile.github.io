<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anne Janette Reyes — Office Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dde8e5;--panel:#fbfdfc;--ink:#14262b;--mut:#4a5f66;--line:#c6d6d2;--acc:#0f766e;--chip:#ffffffd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a1d;--panel:#172226;--ink:#e8f1ef;--mut:#9fb3b8;--line:#2a3b40;--acc:#5eead4;--chip:#172226e6}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a1d;--panel:#172226;--ink:#e8f1ef;--mut:#9fb3b8;--line:#2a3b40;--acc:#5eead4;--chip:#172226e6}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
header{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));pointer-events:none;max-width:70vw}
header h1{margin:0;font-size:clamp(1.2rem,2.6vw,1.9rem);font-weight:800;letter-spacing:-.02em}
.me{display:flex;align-items:center;gap:10px;margin-top:8px;font-weight:600;font-size:1rem}
.me img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--acc)}
header p{margin:4px 0 0;color:var(--mut);font-size:.9rem}
nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px}
nav button,#close,#reset{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px)}
nav button:hover,#close:hover,#reset:hover{border-color:var(--acc)}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#reset{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:none}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:6px;opacity:0;transition:opacity .12s;transform:translate(12px,12px)}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);box-sizing:border-box;background:var(--panel);border-left:1px solid var(--line);padding:calc(24px + env(safe-area-inset-top,0px)) 26px 30px;overflow:auto;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#panel.open{transform:none;visibility:visible}
#panel h2{margin:0 0 4px;font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
#panel .sub{color:var(--mut);margin:0 0 16px}
#panel h3{font-size:1rem;margin:20px 0 4px}
#panel p,#panel li{line-height:1.5;font-size:.95rem}
#panel ul{padding-left:18px;margin:6px 0}
#panel .when{color:var(--mut);font-size:.85rem;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags span{border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:.82rem}
#panel a{color:var(--acc);font-weight:600}
#close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px}
.links{display:grid;gap:8px;margin:14px 0}
.links a{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);font-weight:600}
.links a small{display:block;color:var(--mut);font-weight:400;margin-top:2px}
.links a:hover{border-color:var(--acc)}
details{border-top:1px solid var(--line);margin-top:16px;padding-top:10px}
summary{cursor:pointer;font-weight:700}
.step{display:flex;justify-content:space-between;gap:8px;margin-top:26px}
.step button{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.step button:hover{border-color:var(--acc)}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;color:#14262b;border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-size:.75rem;font-weight:600;text-align:center}
.tile svg,.tile b{width:34px;height:34px}
.tile b{display:grid;place-items:center;border-radius:8px;color:#fff;font-size:.8rem;font-weight:800}
@media (max-width:700px){
 #panel{top:auto;width:100%;height:58%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}
 #panel.open{transform:none}
 nav{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>

scene.background=new THREE.Color(css.getPropertyValue('--bg').trim()||'#dde8e5');
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;$('c').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8aa0a0,.85));
const sun=new THREE.DirectionalLight(0xfff4e0,.8);sun.position.set(-8,16,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-16,right:16,top:14,bottom:-14,near:1,far:50});scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o));
function box(w,h,d,mat,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m}
function cyl(r,h,mat,x,y,z,p){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),mat);m.position.set(x,y,z);m.castShadow=true;p.add(m);return m}
function tex(w,h,draw){const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t}
const pick=[];let hover=null;

function init(){
 box(27,.3,19,M(0x9fb1b2),0,-.15,0).receiveShadow=true;
 box(10,.02,16,M(0x5d7a7d),0,.01,0).scale.set(1,1,1);
 const wall=box(27,6,.3,M(0xf2f5f4),0,3,-9);
 const wt=tex(1400,300,(g,w,h)=>{g.fillStyle='#14262b';g.font='800 120px "Bricolage Grotesque",sans-serif';g.fillText('Anne Janette Reyes',30,150);g.fillStyle='#4a5f66';g.font='400 56px "Bricolage Grotesque",sans-serif';g.fillText('ICT support · websites · graphic design',34,240)});
 const ws=new THREE.Mesh(new THREE.PlaneGeometry(14,3),new THREE.MeshBasicMaterial({map:wt,transparent:true}));ws.position.set(-3,3.6,-8.82);scene.add(ws);
 for(let i=0;i<3;i++){const wn=new THREE.Mesh(new THREE.PlaneGeometry(4,2.2),new THREE.MeshBasicMaterial({color:0xbfe3f2}));wn.position.set(-8+i*8,1.8,-8.84);scene.add(wn);if(i==2)wn.position.x=11}
 D.forEach(build);
}
function icon(k){return tex(128,128,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h);if(k.p){c.save();c.translate(24,24);c.scale(80/24,80/24);c.fillStyle='#'+k.h;c.fill(new Path2D(k.p));c.restore()}else{c.fillStyle='#'+k.h;c.fillRect(14,14,100,100);c.fillStyle='#fff';c.font='800 44px "Bricolage Grotesque",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(k.m,64,68)}})}
function buildSkills(d){
 const g=new THREE.Group();g.userData.d=d;scene.add(g);
 const pm=M(d.c),dark=M(0x2b3438);g.userData.mats=[pm];
 box(7.4,.14,2.6,pm,0,.8,0,g);[[-3.4,-1.1],[3.4,-1.1],[-3.4,1.1],[3.4,1.1]].forEach(p=>box(.14,.8,.14,dark,p[0],.4,p[1],g));
 SK.slice(0,14).forEach((k,i)=>{const up=i<7,x=((up?i:i-7)-3)*1.0;
  const t=new THREE.Mesh(new THREE.PlaneGeometry(.8,.8),new THREE.MeshBasicMaterial({map:icon(k)}));
  if(up){box(.9,.9,.05,dark,x,1.35,-.8,g);t.position.set(x,1.35,-.77)}else{t.rotation.x=-Math.PI/2;t.position.set(x,.88,.5)}
  g.add(t)});
 const st=tex(512,128,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle='#14808a';c.fillRect(0,0,14,h);c.fillStyle='#14262b';c.font='800 44px "Bricolage Grotesque",sans-serif';c.textBaseline='middle';c.fillText(d.n,34,h/2)});
 const sg=new THREE.Mesh(new THREE.PlaneGeometry(2.8,.7),new THREE.MeshBasicMaterial({map:st}));sg.position.set(0,2.45,-.9);g.add(sg);box(.06,.8,.06,dark,-1,2,-.95,g);box(.06,.8,.06,dark,1,2,-.95,g);
 g.traverse(o=>{if(o.isMesh)pick.push(o)});
}
function skillsHTML(){const gs={};SK.forEach(k=>(gs[k.g]=gs[k.g]||[]).push(k));return Object.keys(gs).map(g=>`<h3>${g}</h3><div class="sk">${gs[g].map(k=>`<div class="tile">${k.p?`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#${k.h}" d="${k.p}"/></svg>`:`<b style="background:#${k.h}">${k.m}</b>`}<span>${k.n}</span></div>`).join('')}</div>`).join('')}
function build(d){if(d.id=='skills')return buildSkills(d);
 const g=new THREE.Group();g.position.set(d.x,0,d.z);g.userData.d=d;scene.add(g);
 const pm=M(d.c),mats=[pm];g.userData.mats=mats;
 const wood=M(0xe3cfae),dark=M(0x2b3438),white=M(0xf5f5f5);
 box(6,1.5,.15,pm,0,.75,-2.5,g);box(.15,1.5,5,pm,-3,.75,0,g);box(.15,1.5,5,pm,3,.75,0,g);
 box(6.1,.08,.25,M(0xffffff),0,1.54,-2.5,g);
 const dm=M(0xe3cfae);mats.push(dm);
 box(4,.12,1.4,dm,0,.8,-1.75,g);box(.12,.8,1.3,wood,-1.9,.4,-1.75,g);box(.12,.8,1.3,wood,1.9,.4,-1.75,g);
 const scr=(x,ry,w,lk,lb)=>{const gr=new THREE.Group();gr.position.set(x,0,-1.95);gr.rotation.y=ry;g.add(gr);
  box(w,.6,.06,dark,0,1.25,0,gr);box(.1,.3,.1,dark,0,.98,0,gr);
  const mt=new THREE.MeshBasicMaterial({color:d.c});
  if(lk){mt.color.set(0xffffff);mt.map=tex(512,Math.round(256/(w-.1)),(c,cw,ch)=>{c.fillStyle='#14262b';c.fillRect(0,0,cw,ch);c.textAlign='center';c.fillStyle='#fff';c.font='800 '+Math.round(cw/14)+'px "Bricolage Grotesque",sans-serif';c.fillText(lb,cw/2,ch*.5);c.fillStyle='#8fd3c8';c.font='400 '+Math.round(cw/20)+'px "Bricolage Grotesque",sans-serif';c.fillText('click to open',cw/2,ch*.75)})}else mt.color.offsetHSL(0,-.1,.25);
  const s=new THREE.Mesh(new THREE.PlaneGeometry(w-.1,.5),mt);s.position.set(0,1.25,.035);gr.add(s);if(lk){s.userData.link=lk;s.userData.label=lb}};
 if(d.id!='web')scr(0,0,1);
 box(.8,.04,.28,dark,0,.88,-1.3,g);
 // chair
 const ch=M(0x39464b),cg=new THREE.Group();cg.position.set(0,0,-.4);g.add(cg);g.userData.chair=cg;cyl(.38,.1,ch,0,.55,0,cg);box(.7,.6,.1,ch,0,.95,-.35,cg);cyl(.04,.45,dark,0,.3,0,cg);cyl(.3,.05,dark,0,.04,0,cg);
 // plant
 cyl(.22,.35,M(0xffffff),-2.4,.18,1.9,g);const pl=new THREE.Mesh(new THREE.SphereGeometry(.38,14,10),M(0x3f8f4a));pl.position.set(-2.4,.65,1.9);pl.castShadow=true;g.add(pl);
 // props
 if(d.id=='ict'){box(.7,1.2,1,dark,2.3,.6,-1.8,g);const cam=box(.5,.3,.3,white,2.85,1.35,-1,g);cam.rotation.y=-.5;const l=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.2,12),dark);l.rotation.x=Math.PI/2;l.position.set(2.8,1.35,-.75);g.add(l);}
 if(d.id=='web'){scr(-1.1,.3,1.2,'https://www.7afunding.com/','7afunding.com');scr(1.1,-.3,1.2,'https://blueoceansrescue.com/','blueoceansrescue.com');}
 if(d.id=='gfx'){box(.7,.04,.5,dark,1.3,.88,-1.2,g);const e=box(1.3,1.6,.08,M(0xffffff),-2.2,1.5,-1,g);e.rotation.y=.4;box(.2,.2,.02,M(0xe0803a),-2.2,1.6,-.95,g).rotation.y=.4;box(.2,.3,.02,M(0x3b82c4),-2.0,1.3,-.9,g).rotation.y=.4;box(.08,1.5,.08,wood,-2.5,.75,-.9,g);box(.08,1.5,.08,wood,-1.9,.75,-1.1,g);}
 if(d.id=='sys'){box(.9,2.1,.9,dark,2.3,1.05,-1.9,g);for(let i=0;i<5;i++)box(.5,.05,.02,new THREE.MeshBasicMaterial({color:i%2?0x4ade80:0x60a5fa}),2.3,.5+i*.35,-1.44,g);}
 if(d.id=='edu'){box(1.1,2.4,.5,wood,2.3,1.2,-2.1,g);for(let i=0;i<4;i++)for(let j=0;j<3;j++)box(.25,.4,.3,M([0xc9486b,0x3b82c4,0xe0803a,0x4d9a52][(i+j)%4]),1.95+j*.35,.4+i*.55,-1.9,g);box(.5,.04,.5,dark,1.3,.9,-1.2,g);cyl(.18,.1,dark,1.3,.84,-1.2,g);}
 if(d.id=='contact'){box(.6,.03,.4,white,1.2,.88,-1.2,g);box(.4,.12,.7,dark,-1.2,.88,-1.2,g);box(.5,1.6,.4,M(0x4d9a52),2.3,.8,-2,g);}
 // sign
 const st=tex(512,128,(c,w,h)=>{c.fillStyle='#ffffff';c.fillRect(0,0,w,h);c.fillStyle='#'+d.c.toString(16).padStart(6,'0');c.fillRect(0,0,14,h);c.fillStyle='#14262b';c.font='800 44px "Bricolage Grotesque",sans-serif';c.textBaseline='middle';c.fillText(d.n,34,h/2)});
 const sg=new THREE.Mesh(new THREE.PlaneGeometry(2.8,.7),new THREE.MeshBasicMaterial({map:st}));sg.position.set(0,2.15,-2.4);g.add(sg);box(.06,.5,.06,dark,-1,1.8,-2.45,g);box(.06,.5,.06,dark,1,1.8,-2.45,g);
 g.traverse(o=>{if(o.isMesh)pick.push(o)});
}
const owner=o=>{while(o&&!(o.userData&&o.userData.d))o=o.parent;return o};

// camera
const base=()=>innerWidth/innerHeight<1?44:28;
const st={th:0,ph:.95,d:base()+22,tx:0,ty:0,tz:0},goal={th:0,ph:.95,d:base(),tx:0,ty:0,tz:0};
function place(){const s=st;camera.position.set(s.tx+s.d*Math.sin(s.ph)*Math.sin(s.th),s.ty+s.d*Math.cos(s.ph),s.tz+s.d*Math.sin(s.ph)*Math.cos(s.th));camera.lookAt(s.tx,s.ty,s.tz)}
function tick(t){const k=reduce?1:.07;scene.children.forEach(o=>{const c=o.userData&&o.userData.chair;if(c){const on=current&&o.userData.d===current&&!reduce;c.rotation.y+=((on?Math.sin(t/700)*.7:0)-c.rotation.y)*.08}});for(const a in goal)st[a]+=(goal[a]-st[a])*k;place();renderer.render(scene,camera);requestAnimationFrame(tick)}

// interaction
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down=null,drag=false,current=null,lastObj=null;
function hit(e){const r=renderer.domElement.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mp,camera);const h=ray.intersectObjects(pick)[0];lastObj=h?h.object:null;return h?owner(h.object):null}
function glow(g,on){g.userData.mats.forEach(m=>m.emissive.setHex(on?0x2a2a2a:0))}
const el=$('c');
el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,th:goal.th,ph:goal.ph};drag=false;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{
 if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>6)drag=true;
  if(drag&&!current){goal.th=Math.max(-.9,Math.min(.9,down.th-dx*.005));goal.ph=Math.max(.5,Math.min(1.3,down.ph-dy*.004))}return}
 const g=hit(e);if(g!==hover){if(hover)glow(hover,false);hover=g;if(g)glow(g,true)}
 el.style.cursor=g?'pointer':'grab';const t=$('tip');t.style.opacity=g?1:0;if(g){const lk=lastObj&&lastObj.userData.link&&current===g.userData.d;t.textContent=lk?'Open '+lastObj.userData.label:g.userData.d.n;t.style.left=e.clientX+'px';t.style.top=e.clientY+'px'}});
el.addEventListener('pointerup',e=>{const was=drag;down=null;if(!was){const g=hit(e);if(g){if(current===g.userData.d&&lastObj.userData.link)window.open(lastObj.userData.link,'_blank','noopener');else open(g.userData.d)}}});
el.addEventListener('wheel',e=>{e.preventDefault();if(!current)goal.d=Math.max(10,Math.min(base()+10,goal.d+e.deltaY*.02))},{passive:false});

// panel
function open(d){
 current=d;const wide=innerWidth>700,i=D.indexOf(d),n=D.length;
 Object.assign(goal,{th:0,ph:d.ph||.9,d:10.5,tx:d.x+(wide?3:0),ty:.8,tz:d.z+(wide?0:2.6)});
 const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 let h=`<h2>${d.t}</h2><p class="sub"><span class="swatch" style="background:#${d.c.toString(16).padStart(6,'0')}"></span>${d.s}</p>`;
 if(d.w)h+=`<p class="when">${d.w}</p>`;
 if(d.l.length)h+=li(d.l);
 if(d.skills)h+=skillsHTML();
 if(d.email)h+=`<p><a href="mailto:${d.email}">${d.email}</a></p>`;
 if(d.links)h+=`<div class="links">${d.links.map(k=>`<a href="${k.u}" target="_blank" rel="noopener">${k.t}<small>${k.d}</small></a>`).join('')}</div>`;
 if(d.hint)h+=`<p class="when">${d.hint}</p>`;
 if(d.more)h+=`<details><summary>${d.more.h}</summary>${li(d.more.l)}</details>`;
 if(d.tags.length)h+=`<div class="tags">${d.tags.map(t=>`<span>${t}</span>`).join('')}</div>`;
 h+=`<div class="step"><button type="button" id="pv">‹ ${D[(i+n-1)%n].n}</button><button type="button" id="nx">${D[(i+1)%n].n} ›</button></div>`;
 $('content').innerHTML=h;$('pv').onclick=()=>open(D[(i+n-1)%n]);$('nx').onclick=()=>open(D[(i+1)%n]);
 $('panel').scrollTop=0;$('panel').classList.add('open');$('reset').style.display='block';
}
function closeIt(){current=null;$('panel').classList.remove('open');$('reset').style.display='none';Object.assign(goal,{th:0,ph:.95,d:base(),tx:0,ty:0,tz:0})}
$('close').onclick=$('reset').onclick=closeIt;
addEventListener('keydown',e=>{if(e.key==='Escape'&&current)closeIt()});
D.forEach(d=>{const b=document.createElement('button');b.type='button';b.textContent=d.n;b.onclick=()=>open(d);$('nav').appendChild(b)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(!current)goal.d=base()});

(document.fonts&&document.fonts.load?document.fonts.load('800 40px "Bricolage Grotesque"'):Promise.resolve()).catch(()=>{}).then(()=>{init();tick(0)});
</script>
</body>
</html>
